[package]
name = "speedtest"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Private speed test: app plus on-demand Docker test workers"

[[bin]]
name = "speedtest"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
futures-util = "0.3"
http-body-util = "0.1"
bytes = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
